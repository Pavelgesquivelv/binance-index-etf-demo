fund:
  name: Crypto Index ETF Demo
  base_currency: USDC
  initial_capital: '5000'
  shares_outstanding: '50'
  order_prefix: IDXETF_
index_feed:
  portfolio_file: data/feeds/current.json
storage:
  database: data/index_etf.db
environment:
  exchange: BINANCE
  mode: DEMO
execution:
  single_order_test_asset: BNB
  single_order_test_usdc: '25'
  full_rebalance:
    max_orders: 20
    fee_buffer_multiplier: '2'
account_isolation:
  dedicated_bnb_fee_reserve: '0.02000000'
cash_contributions:
  enabled: true
  currency: USDC
  amount: '200'
  schedule:
    frequency: weekly
    weekday: MONDAY
    time_local: 09:00
    timezone: America/Mexico_City
    start_date_local: '2026-09-28'
    catch_up_policy: no_backfill
  investment:
    mode: target_weight_of_contribution
    allow_sells: false
    trigger_rebalance: false
    residual_cash_policy: carry_forward
  execution:
    max_orders: 20
    fee_buffer_multiplier: '2'

index_feed_bridge:
  enabled: true
  source_directory: /home/cryptobot/crypto_index/runs/daily/portfolios
  filename_template: portfolio_{cutoff_date}.json

  cutoff:
    frequency: monthly
    rule: last_calendar_day
    time_local: '07:00'
    timezone: America/Mexico_City
    grace_minutes: 15

  source_stability:
    settle_seconds: 1.0

  destination:
    current_file: data/feeds/current.json
    archive_directory: data/feeds/archive

